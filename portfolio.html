<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Lumen Studio</title>
<meta name="description" content="Browse Lumen Studio's wedding, portrait, and event photography.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .gallery-item{ padding:0; overflow:hidden; background:none; }
  .gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.4s ease;
  }
  .gallery-item:hover img{ transform:scale(1.05); }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">Lumen Studio</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="portfolio.html" aria-current="page">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="booking.html">Book Now</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light mode" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <a href="booking.html" class="btn btn-primary">Book Now</a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="page-header">
    <div class="page-header-inner">
      <p class="section-tag">Portfolio</p>
      <h1>A selection of recent sessions</h1>
      <p>Filter by category, or click any image to see it larger.</p>
    </div>
  </div>

  <section class="reveal" style="padding-top:48px;">
    <div class="filter-bar" role="group" aria-label="Filter gallery by category">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="wedding">Weddings</button>
      <button class="filter-btn" data-filter="portrait">Portraits</button>
      <button class="filter-btn" data-filter="event">Events</button>
    </div>

    <div class="gallery-grid">
      <button class="gallery-item" data-category="wedding" data-caption="First look, Lahore — April">
        <img src="https://picsum.photos/seed/lumen-wedding1/300/375" alt="First look, Lahore — April" loading="lazy">
      </button>
      <button class="gallery-item" data-category="portrait" data-caption="Studio portrait series">
        <img src="https://picsum.photos/seed/lumen-portrait1/300/375" alt="Studio portrait series" loading="lazy">
      </button>
      <button class="gallery-item" data-category="event" data-caption="Product launch, Karachi">
        <img src="https://picsum.photos/seed/lumen-event1/300/375" alt="Product launch, Karachi" loading="lazy">
      </button>
      <button class="gallery-item" data-category="wedding" data-caption="Reception details">
        <img src="https://picsum.photos/seed/lumen-wedding2/300/375" alt="Reception details" loading="lazy">
      </button>
      <button class="gallery-item" data-category="portrait" data-caption="Outdoor portrait, golden hour">
        <img src="https://picsum.photos/seed/lumen-portrait2/300/375" alt="Outdoor portrait, golden hour" loading="lazy">
      </button>
      <button class="gallery-item" data-category="event" data-caption="Conference keynote">
        <img src="https://picsum.photos/seed/lumen-event2/300/375" alt="Conference keynote" loading="lazy">
      </button>
      <button class="gallery-item" data-category="wedding" data-caption="Mehndi, evening">
        <img src="https://picsum.photos/seed/lumen-wedding3/300/375" alt="Mehndi, evening" loading="lazy">
      </button>
      <button class="gallery-item" data-category="portrait" data-caption="Family session">
        <img src="https://picsum.photos/seed/lumen-portrait3/300/375" alt="Family session" loading="lazy">
      </button>
      <button class="gallery-item" data-category="event" data-caption="Corporate dinner">
        <img src="https://picsum.photos/seed/lumen-event3/300/375" alt="Corporate dinner" loading="lazy">
      </button>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <span class="logo">Lumen Studio</span>
      <p>Photography for weddings, portraits, and events.</p>
    </div>
    <div class="footer-links">
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="booking.html">Book Now</a>
    </div>
  </div>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightboxOverlay">
  <div class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxCaption">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
    <div class="lightbox-img" id="lightboxImg"></div>
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
