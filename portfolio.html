<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Lumen Studio</title>
<meta name="description" content="Browse Lumen Studio's wedding, portrait, and event photography.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">Lumen Studio</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="portfolio.html" aria-current="page">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="booking.html">Book Now</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light mode" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <a href="booking.html" class="btn btn-primary">Book Now</a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="page-header">
    <div class="page-header-inner">
      <p class="section-tag">Portfolio</p>
      <h1>A selection of recent sessions</h1>
      <p>Filter by category, or click any image to see it larger.</p>
    </div>
  </div>

  <section class="reveal" style="padding-top:48px;">
    <div class="filter-bar" role="group" aria-label="Filter gallery by category">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="wedding">Weddings</button>
      <button class="filter-btn" data-filter="portrait">Portraits</button>
      <button class="filter-btn" data-filter="event">Events</button>
    </div>

    <div class="gallery-grid">
      <button class="gallery-item" data-category="wedding" data-caption="First look, Lahore — April">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#2A211B"/><circle cx="150" cy="150" r="60" fill="#D98E3F" opacity="0.8"/><rect x="90" y="230" width="120" height="10" rx="5" fill="#3E7F79"/></svg>
      </button>
      <button class="gallery-item" data-category="portrait" data-caption="Studio portrait series">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#241F1C"/><ellipse cx="150" cy="140" rx="50" ry="65" fill="#B3A99E" opacity="0.6"/></svg>
      </button>
      <button class="gallery-item" data-category="event" data-caption="Product launch, Karachi">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#2E2520"/><rect x="60" y="100" width="180" height="120" rx="8" fill="#3E7F79" opacity="0.7"/></svg>
      </button>
      <button class="gallery-item" data-category="wedding" data-caption="Reception details">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#271F19"/><circle cx="110" cy="130" r="30" fill="#D98E3F"/><circle cx="190" cy="180" r="20" fill="#D98E3F" opacity="0.6"/></svg>
      </button>
      <button class="gallery-item" data-category="portrait" data-caption="Outdoor portrait, golden hour">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#2A2017"/><circle cx="150" cy="100" r="40" fill="#D98E3F" opacity="0.5"/><ellipse cx="150" cy="220" rx="70" ry="90" fill="#241F1C"/></svg>
      </button>
      <button class="gallery-item" data-category="event" data-caption="Conference keynote">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#231D18"/><rect x="40" y="260" width="220" height="8" fill="#3E7F79"/><rect x="100" y="80" width="100" height="160" fill="#3E7F79" opacity="0.3"/></svg>
      </button>
      <button class="gallery-item" data-category="wedding" data-caption="Mehndi, evening">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#2C2117"/><circle cx="150" cy="190" r="90" fill="#D98E3F" opacity="0.25"/><circle cx="150" cy="190" r="50" fill="#D98E3F" opacity="0.6"/></svg>
      </button>
      <button class="gallery-item" data-category="portrait" data-caption="Family session">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#241E1A"/><circle cx="110" cy="160" r="32" fill="#B3A99E" opacity="0.5"/><circle cx="190" cy="160" r="32" fill="#B3A99E" opacity="0.7"/></svg>
      </button>
      <button class="gallery-item" data-category="event" data-caption="Corporate dinner">
        <svg viewBox="0 0 300 375" fill="none"><rect width="300" height="375" fill="#271F1A"/><circle cx="90" cy="120" r="14" fill="#D98E3F"/><circle cx="150" cy="110" r="14" fill="#D98E3F"/><circle cx="210" cy="120" r="14" fill="#D98E3F"/></svg>
      </button>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <span class="logo">Lumen Studio</span>
      <p>Photography for weddings, portraits, and events.</p>
    </div>
    <div class="footer-links">
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="booking.html">Book Now</a>
    </div>
  </div>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightboxOverlay">
  <div class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxCaption">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
    <div class="lightbox-img" id="lightboxImg"></div>
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
